version: '3.8'

services:
  api:
    build: .
    container_name: rag_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=RAG Backend API
      - DEBUG=True
      - DATABASE_URL=sqlite:///./rag_app.db
      - REDIS_URL=redis://redis:6379/0
      - VECTOR_DB_TYPE=qdrant
      - QDRANT_LOCATION=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=documents
      - USE_MOCK_LLM=True
    depends_on:
      - redis
      - qdrant
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    container_name: rag_redis_memory
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
